name: work-management-starter-kit

services:
  db:
    image: postgres:18-alpine
    container_name: work-management-starter-kit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: starterkit
      POSTGRES_USER: starterkit
      POSTGRES_PASSWORD: starterkit_local_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - work_management_starter_kit_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starterkit -d starterkit"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - work_management_starter_kit_network

volumes:
  work_management_starter_kit_postgres_data:
    name: work-management-starter-kit-postgres-data

networks:
  work_management_starter_kit_network:
    name: work-management-starter-kit-network
