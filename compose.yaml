name: ${COMPOSE_PROJECT_NAME:-work-management-starter-kit}

services:
  db:
    image: postgres:18-alpine
    container_name: ${COMPOSE_CONTAINER_NAME:-work-management-starter-kit-db}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-starterkit}
      POSTGRES_USER: ${POSTGRES_USER:-starterkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starterkit_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - work_management_starter_kit_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - work_management_starter_kit_network

volumes:
  work_management_starter_kit_postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-work-management-starter-kit-postgres-data}

networks:
  work_management_starter_kit_network:
    name: ${POSTGRES_NETWORK_NAME:-work-management-starter-kit-network}
